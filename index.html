<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ako_favicon.png" />
    <!-- viewport-fit=cover lets the page paint into the iOS safe-area
         insets (notch/home-indicator strips) instead of Safari treating
         that space as a separate, unstyled bar — required for the
         bottom bar to pick up the app's background color.
         interactive-widget=resizes-content (Chrome 108+) makes the
         layout viewport — and so `dvh` units — actually shrink when the
         on-screen keyboard opens, instead of the keyboard just
         overlaying a viewport that never resizes. MessageThread's
         h-dvh chat layout relies on this so the keyboard can never
         cover the composer or the message being replied to. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Colours Safari's address-bar/toolbar chrome (and Android's status
         bar) to match the app. Content is overwritten synchronously below
         and again by useTheme.tsx on every theme change — this starting
         value only matters for a split second before that script runs. -->
    <meta name="theme-color" content="#FDFBF6" />
    <title>Akọ — A Reason To Reason</title>
    <meta name="description" content="Discover and share projects, books, courses, events and more on Akọ." />
    <meta property="og:site_name" content="Akọ" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akọ — A Reason To Reason" />
    <meta property="og:description" content="Discover and share projects, books, courses, events and more on Akọ." />
    <meta property="og:image" content="https://myako.site/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://myako.site/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <!--
      Sets .dark and .page-mode on <html> before React mounts (and before
      first paint) — .dark from the same localStorage key useTheme.tsx
      uses, .page-mode from a cached hint of the last identity mode we
      saw (written by usePageThemeSync.ts whenever the real server query
      resolves). Without this, the page always paints light/personal
      first, then flips a beat later once React mounts and that query
      comes back — a visible flash on every load for anyone using dark
      mode or currently acting as a page. Kept deliberately tiny and
      dependency-free since it has to run synchronously, blocking, in
      <head>.

      The page-mode hint can go stale — e.g. removed from the page's
      team on another device — since unlike theme (pure client
      preference) it's a guess about server state made before that
      server has been asked. That's an accepted trade: usePageThemeSync
      corrects it within one query round-trip of mount if it's wrong,
      same as any other stale-cache-then-refetch pattern, and "usually
      right immediately, rarely corrected a moment later" beats "always
      wrong for a moment" on every single load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ako-theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");

          // The hint is "page:<userId>" and only counts for the person whose
          // session is stored right now — otherwise a different account
          // opened on this browser would inherit the last one's page palette.
          var isPageMode = false;
          var hint = localStorage.getItem("ako-active-mode") || "";
          if (hint.indexOf("page:") === 0) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && /^sb-.*-auth-token$/.test(k)) {
                var sess = JSON.parse(localStorage.getItem(k) || "null");
                if (sess && sess.user && sess.user.id === hint.slice(5)) isPageMode = true;
              }
            }
          }
          if (isPageMode) document.documentElement.classList.add("page-mode");

          // Keep in sync with --color-surface in src/index.css (topnav/
          // bottomnav color) for all four theme/mode combinations.
          var surfaceColor = isPageMode
            ? isDark
              ? "#17110C"
              : "#FCF6EC"
            : isDark
              ? "#131311"
              : "#FDFBF6";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", surfaceColor);
        } catch (e) {
          // localStorage/matchMedia unavailable (privacy mode, old
          // browser) — fall back to light/personal, same as if nothing
          // were set.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Boot guard. If the app bundle fails before React mounts (a script that won't parse/run on an older browser,
      a blocked request, a module that throws on load) the React ErrorBoundary can't help — it doesn't exist yet —
      and the visitor is left staring at an empty page. This shows a plain, recoverable message instead, using
      only ES5 so it runs everywhere. It does nothing once #root has content.
    -->
    <script>
      (function () {
        var shown = false;
        function mounted() {
          var r = document.getElementById("root");
          return !!(r && r.childElementCount);
        }
        function show() {
          if (shown || mounted()) return;
          shown = true;
          var d = document.createElement("div");
          d.setAttribute("role", "alert");
          d.style.cssText =
            "position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;background:#131311;color:#e8e6df";
          d.innerHTML =
            '<p style="margin:0 0 6px;font-size:17px;font-weight:600">Akọ didn\u2019t finish loading</p>' +
            '<p style="margin:0 0 18px;max-width:300px;opacity:.7">Please check your connection and try again. If it keeps happening, update your browser or turn off content blockers for this site.</p>' +
            '<button style="padding:10px 22px;border:0;border-radius:999px;font:inherit;font-weight:600;background:#e8e6df;color:#131311" onclick="location.reload()">Reload</button>';
          document.body.appendChild(d);
        }
        // `true` = capture phase, so failed <script> loads (which don't bubble) are caught too.
        window.addEventListener("error", function () { setTimeout(show, 0); }, true);
        window.addEventListener("unhandledrejection", function () { setTimeout(show, 0); });
        // Last resort: nothing mounted after 10s (hung request, blocked script).
        setTimeout(show, 10000);
        // If the app mounts late, remove the message.
        var t = setInterval(function () {
          if (mounted()) {
            clearInterval(t);
            var a = document.querySelector('body > div[role="alert"]');
            if (a) a.parentNode.removeChild(a);
          }
        }, 500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
