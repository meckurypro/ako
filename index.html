<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page paint into the iOS safe-area
         insets (notch/home-indicator strips) instead of Safari treating
         that space as a separate, unstyled bar — required for the
         bottom bar to pick up the app's background color. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colors Safari's address-bar/toolbar chrome (and Android's status
         bar) to match the app. Content is overwritten synchronously below
         and again by useTheme.tsx on every theme change — this starting
         value only matters for a split second before that script runs. -->
    <meta name="theme-color" content="#FDFBF6" />
    <title>Akọ — A Reason To Reason</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Sets .dark on <html> before React mounts (and before first paint),
      reading the same localStorage key useTheme.tsx uses. Without this,
      the page always paints light first, then flips to dark a beat
      later once React runs — a visible flash on every load for anyone
      using dark mode. Kept deliberately tiny and dependency-free since
      it has to run synchronously, blocking, in <head>.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ako-theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
          // Keep in sync with --color-surface in src/index.css (topnav/
          // bottomnav color) for both themes.
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", isDark ? "#131311" : "#FDFBF6");
        } catch (e) {
          // localStorage/matchMedia unavailable (privacy mode, old
          // browser) — fall back to light, same as if nothing were set.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
